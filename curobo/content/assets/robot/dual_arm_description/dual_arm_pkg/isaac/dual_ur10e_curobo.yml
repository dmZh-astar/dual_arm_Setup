# cuRobo robot configuration -- bimanual UR10e + Robotiq 2F-140.
#
# Generated from config/dual_arm_real_v2.urdf.xacro. Link/joint names and the
# self_collision_ignore adjacencies are read from that URDF and verified against
# it. SPHERE RADII AND CENTERS ARE UNVERIFIED ESTIMATES -- see
# isaac/right_arm_descriptor.yaml and tune them in Isaac Sim before relying on
# this for collision avoidance.
#
# Dual-arm: base_link is `world`, so both arms live in one kinematic tree and
# cuRobo checks arm-vs-arm collision natively. link_names lists both TCPs.
# The two base links are deliberately NOT in each other's ignore list.
#
# table_link and cobot_frame_link are intentionally absent -- static environment
# belongs in the world collision config, not the robot body.
robot_cfg:
  kinematics:
    urdf_path: dual_arm.urdf
    asset_root_path: ''
    usd_path: dual_arm.usd
    usd_robot_root: /dual_arm
    base_link: world
    ee_link: right_tcp
    link_names: [right_tcp, left_tcp]
    lock_joints: {right_finger_joint: 0.0, right_left_inner_finger_joint: 0.0, right_left_inner_knuckle_joint: 0.0,
      right_right_outer_knuckle_joint: 0.0, right_right_inner_finger_joint: 0.0, right_right_inner_knuckle_joint: 0.0,
      left_finger_joint: 0.0, left_left_inner_finger_joint: 0.0, left_left_inner_knuckle_joint: 0.0, left_right_outer_knuckle_joint: 0.0,
      left_right_inner_finger_joint: 0.0, left_right_inner_knuckle_joint: 0.0}
    extra_links: {}
    collision_link_names: &id001 [right_base_link_inertia, right_shoulder_link, right_upper_arm_link,
      right_forearm_link, right_wrist_1_link, right_wrist_2_link, right_wrist_3_link, right_robotiq_140_base_link,
      right_left_outer_finger, right_left_inner_finger, right_right_outer_finger, right_right_inner_finger,
      left_base_link_inertia, left_shoulder_link, left_upper_arm_link, left_forearm_link, left_wrist_1_link,
      left_wrist_2_link, left_wrist_3_link, left_robotiq_140_base_link, left_left_outer_finger, left_left_inner_finger,
      left_right_outer_finger, left_right_inner_finger]
    collision_spheres:
      right_base_link_inertia:
      - center: [0.0, 0.0, 0.04]
        radius: 0.085
      - center: [0.0, 0.0, 0.14]
        radius: 0.08
